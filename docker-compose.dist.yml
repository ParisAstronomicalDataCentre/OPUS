services:

  db:
    image: postgres:18  # pin the major version: a data volume cannot be read by another major version
    restart: always
    # database, user and password of OPUS (OPUS_PGSQL_* in .env.docker), given to the postgres image as POSTGRES_*
    # (used only when the db_data volume is created: to change the password later, see docs/install.md)
    env_file: .env.docker
    entrypoint:
      - sh
      - -c
      - |
        export POSTGRES_DB="$${OPUS_PGSQL_DATABASE:-opus}" POSTGRES_USER="$${OPUS_PGSQL_USER:-opus}"
        export POSTGRES_PASSWORD="$$OPUS_PGSQL_PASSWORD"
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${OPUS_PGSQL_USER:-opus}\" -d \"$${OPUS_PGSQL_DATABASE:-opus}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  opus-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.docker  # OPUS settings (see .env.docker.dist)
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      -  opus_data:/var/opt/opus
    extra_hosts:
      - "opus-docker.localhost:127.0.0.1"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:
  opus_data:
