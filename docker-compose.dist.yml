services:

  db:
    image: postgres:18  # pin the major version: a data volume cannot be read by another major version
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opus -d opus"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_DB=opus
      - POSTGRES_USER=opus
      - POSTGRES_PASSWORD=opus
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  opus-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env.docker  # OPUS settings (see .env.docker.dist)
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      -  opus_data:/var/opt/opus
    extra_hosts:
      - "opus-docker.localhost:127.0.0.1"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:
  opus_data:
