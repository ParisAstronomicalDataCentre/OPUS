{% extends "skeleton.html" %}
{% block js %}
    <script type="text/javascript" src="/static/js/show_log.js" defer></script>
{% endblock %}
{% block variables %}
        <div id="logfile" style="display:none" value="{{ logfile }}"></div>
{% endblock %}
{% block content %}
	<div class="container bs-docs-container">
        <div id="job_list_panel" class="panel panel-default">
            <div class="panel-heading clearfix">
                <div class="btn-group pull-right">
                    <button id="refresh_list" type="button" class="actions btn btn-default">
                        <span class="glyphicon glyphicon-refresh"></span>
                        Refresh log
                    </button>
                    <span>
                        <select name="nlines" class="selectpicker" title="Please Select...">
                            <option value="100" selected>100 Lines</option>
                            <option value="500">500 Lines</option>
                            <option value="1000">1000 Lines</option>
                        </select>
                    </span>
                </div>
                <span class="panel-title pull-left" style="padding-top: 6px; padding-right: 6px;">{{ title }} viewer</span>
            </div>
            <pre id="pre_log" class="panel-body">
log
            </pre>
        </div> <!-- panel -->
	</div> <!-- container -->
{% endblock %}
