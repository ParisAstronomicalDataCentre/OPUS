{% extends "skeleton.html" %}
{% block css %}
    <style>
        #pre_log { max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
        #pre_log .log-debug { color: #888; }
        #pre_log .log-warning { color: #8a6d3b; background-color: #fcf8e3; }
        #pre_log .log-error { color: #a94442; background-color: #f2dede; }
        #log_toolbar .form-control, #log_toolbar .btn { margin: 2px 0; }
    </style>
{% endblock %}
{% block js %}
    <script type="text/javascript" src="/static/js/show_log.js" defer></script>
{% endblock %}
{% block content %}
	<div class="container bs-docs-container">
        <div id="log_panel" class="panel panel-default">
            <div class="panel-heading clearfix">
                <span class="panel-title pull-left" style="padding-top: 6px; padding-right: 6px;">Logs</span>
                <form id="log_toolbar" class="form-inline pull-right" onsubmit="return false;">
                    <select name="logfile" class="form-control input-sm" title="Log file">
{% for group, url, files in groups %}
                        <optgroup label="{{ group }}">
{% for file in files %}
                            <option value="{{ file }}" data-url="{{ url }}"{{ ' selected' if file == selected }}>{{ file }}.log</option>
{% endfor %}
                        </optgroup>
{% endfor %}
                    </select>
                    <select name="nlines" class="form-control input-sm" title="Number of lines">
                        <option value="100" selected>100 lines</option>
                        <option value="500">500 lines</option>
                        <option value="1000">1000 lines</option>
                        <option value="5000">5000 lines</option>
                    </select>
                    <input name="filter" type="text" class="form-control input-sm" placeholder="Filter lines" title="Show the lines containing this text (case insensitive)"/>
                    <label class="checkbox-inline" title="Refresh every 10 seconds">
                        <input name="autorefresh" type="checkbox"/> Auto refresh
                    </label>
                    <button id="refresh_log" type="button" class="btn btn-default btn-sm">
                        <span class="glyphicon glyphicon-refresh"></span>
                        Refresh
                    </button>
                </form>
            </div>
            <div class="panel-body">
                <p id="log_info" class="text-muted small"></p>
                <pre id="pre_log"></pre>
            </div>
        </div> <!-- panel -->
	</div> <!-- container -->
{% endblock %}
