events {
    worker_connections 1024;
}

http {
    # Access and error logs
    access_log var/logs/nginx_access.log combined;
    error_log  var/logs/nginx_error.log;

    # Upstream for apps (uvicorn will run these)
    upstream opus_client {
        server 127.0.0.1:8001;
    }

    upstream opus_server {
        server 127.0.0.1:8002;
    }

    server {
        listen 80;
        server_name localhost;
        server_admin a@b.c;

        # Static files
        location /static/ {
            alias uws_client/static/;
            expires 30d;
        }

        # Opus Client
        location /opus_client/ {
            proxy_pass http://opus_client/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Opus Server
        location /opus_server/ {
            proxy_pass http://opus_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Deny access to /opt/opus internals
        location ~ ^/opt/opus {
            deny all;
            return 403;
        }
    }
}
